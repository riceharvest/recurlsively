name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BIN: recurlsively

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary (aarch64 musl via cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cargo install cross --locked
          cross build --release --target aarch64-unknown-linux-musl

      - name: Build release binary
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (non-Windows)
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/${{ env.BIN }}"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="${{ env.BIN }}-${VERSION}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/${{ env.BIN }}" "$DIR/"
          cp README.md LICENSE-MIT "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR"
          sha256sum "${DIR}.tar.gz" | tee artifact-sha256.txt

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $dir = "${{ env.BIN }}-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$dir" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN }}.exe" "$dir/"
          Copy-Item README.md, LICENSE-MIT "$dir/"
          Compress-Archive -Path "$dir" -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower() + "  $dir.zip" | Out-File -Encoding ascii artifact-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            artifact-sha256.txt
          retention-days: 90

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS and validate
        run: |
          cd dist
          cat artifact-sha256.txt > SHA256SUMS
          ls *.tar.gz *.zip >> SHA256SUMS-expected 2>/dev/null || true
          rm artifact-sha256.txt
          sort SHA256SUMS -o SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "All release asset checksums validated."

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "recurlsively $GITHUB_REF_NAME" \
            --notes "Prebuilt binaries for recurlsively $GITHUB_REF_NAME.

          ## Targets
          - x86_64-unknown-linux-musl (static)
          - aarch64-unknown-linux-musl (static)
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc

          ## Verify
          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          ## Limitations
          - No JavaScript rendering (static HTML/XHTML only)
          - Respects robots.txt by default; same-origin by default
          - Markdown output is untrusted content: scan before acting on it

          Install: see docs/install.md or run the one-line installer.
          " \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS

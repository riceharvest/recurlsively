[package]
name = "recurlsively"
version = "0.1.0"
edition = "2024"
description = "A secure-by-default deterministic Markdown snapshotter for AI agents."
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[[bin]]
name = "recurlsively"
path = "src/main.rs"

[workspace]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
